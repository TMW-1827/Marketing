name: Публікація сайту

# Збирає навчальний портал і публікує його разом зі звітами на GitHub Pages.
#
# Щоб увімкнути: Settings → Pages → Source: GitHub Actions.
#
# ВАЖЛИВО: цей workflow публікує ВЕСЬ сайт — звіти й портали з кореня
# репозиторію та свіжозібраний навчальний портал у /training-portal/.
# Перехід із «Deploy from a branch» на «GitHub Actions» нічого не ламає:
# усе лишається за тими самими адресами.
#
# Поки Pages роздає гілку, у репозиторії лежить уже зібраний портал —
# workflow просто перекриває його свіжою збіркою.

# Запускається лише вручну. Автозапуск на push вимкнений навмисно:
# поки Pages роздає гілку, GitHub на кожен push сам збирає сайт, і дві
# публікації одного коміту блокують одна одну — обидві висять у черзі
# й падають за таймаутом. Коли Source стане «GitHub Actions», поверніть
# сюди push: branches: [main] — гілкова збірка тоді вже не запускається.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одночасно виконується лише одна публікація; зайві черги скасовуються.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: training-portal-src/package-lock.json

      - name: Встановити залежності порталу
        working-directory: training-portal-src
        run: npm ci

      - name: Зібрати портал
        working-directory: training-portal-src
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Зібрати сайт докупи
        run: |
          mkdir -p _site
          # Звіти та решта статики з кореня — без вихідних файлів порталу
          rsync -a --exclude '_site' --exclude 'training-portal-src' \
                   --exclude 'training-portal' --exclude '.git' \
                   --exclude '.github' ./ _site/
          # Свіжозібраний портал кладемо поверх того, що лежить у репозиторії
          mkdir -p _site/training-portal
          cp -r training-portal-src/dist/. _site/training-portal/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
