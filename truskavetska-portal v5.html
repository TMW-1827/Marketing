<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Навчальний портал ТМ «Трускавецька» — для внутрішнього використання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#005EB8;        /* Pantone 300 C */
  --green:#00966C;       /* Pantone 7724 C */
  --red:#C5003E;         /* Pantone 1935 C */
  --silver:#8A8D8F;      /* Pantone 877 C */
  --blue-deep:#003C77;
  --ink:#0B2137;
  --ink-soft:#4A5F73;
  --line:#D9E2EB;
  --paper:#F2F6FA;
  --card:#FFFFFF;
  --warn:#B3261E;
  --warn-bg:#FCEEED;
  --ok-bg:#E9F5F0;
  --amber:#9A6700;
  --amber-bg:#FFF7E0;
  --disp:"Sofia Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Montserrat","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:.005em;line-height:1.02;margin:0}
h1{font-size:clamp(38px,5.2vw,62px);text-transform:uppercase}
h2{font-size:clamp(28px,3.4vw,40px);text-transform:uppercase}
h3{font-size:23px;text-transform:uppercase;letter-spacing:.01em}
h4{font-size:16.5px;font-family:var(--body);font-weight:700;margin:0}
p{margin:0 0 14px}
a{color:var(--blue)}
code,.mono{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums}

/* ---------- Верхнє меню ---------- */
.hdr{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(11,33,55,.04)}
.hdrtop{display:flex;align-items:center;gap:20px;padding:12px 26px;max-width:1400px;margin:0 auto}
.logo{font-family:var(--disp);font-weight:900;font-size:27px;text-transform:uppercase;letter-spacing:.01em;line-height:1;color:var(--red);text-decoration:none;flex:0 0 auto}
.logo em{font-style:normal;color:var(--red)}
.logo span{display:block;font-family:var(--body);font-size:9px;letter-spacing:.15em;color:var(--ink-soft);font-weight:600;margin-top:4px}
.menubtn{display:none;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;font-family:var(--body);font-size:12.5px;font-weight:600;
  color:var(--ink);cursor:pointer;flex:0 0 auto;max-width:46vw}
.menubtn .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menubtn .car{color:var(--ink-soft);font-size:10px;transition:transform .18s}
.menubtn[aria-expanded="true"]{background:#EAF2FB;border-color:#C2D9F0}
.menubtn[aria-expanded="true"] .car{transform:rotate(180deg)}
.scrim{position:fixed;inset:0;background:rgba(11,33,55,.32);z-index:35;display:none}
.scrim.show{display:block}
.searchbox{flex:1;max-width:430px;position:relative}
.searchbox input{width:100%;padding:9px 13px 9px 40px;border:1px solid var(--line);border-radius:8px;font-family:var(--body);font-size:13.5px;background:var(--paper);color:var(--ink)}
.searchbox input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent;background:#fff}
.searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#93A7B9;pointer-events:none;display:block}
.searchbox .ico svg{display:block;width:16px;height:16px}
.searchbox .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#93A7B9;font-size:19px;line-height:1;padding:5px 8px;cursor:pointer;display:none;border-radius:6px}
.searchbox .clr:hover{color:var(--ink);background:var(--line)}
.searchbox.filled .clr{display:block}
.searchbox.filled input{padding-right:34px}
.searchres button.act{background:#EAF2FB}
.searchres .more{padding:9px 14px;font-size:11.5px;color:var(--ink-soft);background:#F7FAFC;border-top:1px solid var(--line)}
.tabs a:focus-visible,.searchres button:focus-visible,.btn:focus-visible,.chip:focus-visible,.bt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.searchres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 34px rgba(11,33,55,.16);max-height:62vh;overflow-y:auto;display:none;z-index:50}
.searchres.show{display:block}
.searchres button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;font-family:var(--body);font-size:13px;cursor:pointer;color:var(--ink)}
.searchres button:hover{background:var(--paper)}
.searchres button:last-child{border-bottom:0}
.searchres .hint{font-size:11px;color:var(--ink-soft);display:block;margin-top:2px}
.searchres .empty{padding:14px;font-size:13px;color:var(--ink-soft)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;flex:0 0 auto}
.progbar{width:96px;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--green);width:0;transition:width .35s}

.tabs{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;row-gap:2px;padding:2px 16px 0;max-width:1400px;margin:0 auto}
.tabgroup{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;border-left:1px solid var(--line);padding-left:10px;margin-right:10px}
.tabgroup:first-child{border-left:0;padding-left:0}
.tabgroup:last-child{margin-right:0}
.tabs a{padding:9px 11px 8px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--ink-soft);text-decoration:none;border-bottom:3px solid transparent;transition:.14s;display:flex;align-items:center;gap:5px;border-radius:6px 6px 0 0}
.tabs a:hover{color:var(--ink);background:var(--paper)}
.tabs a.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700;background:var(--paper)}
.tabs a .ck{color:var(--green);font-size:10.5px;opacity:0}
.tabs a.done .ck{opacity:1}
.tabs .glab{display:flex;align-items:center;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#9DB1C4;font-weight:700;padding-right:8px;white-space:nowrap}

.wrap{padding:34px 26px 90px;max-width:1060px;margin:0 auto}
section.pane{display:none;animation:fade .22s ease}
section.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:12px;font-weight:600}
.lede{font-size:17px;line-height:1.62;color:var(--ink-soft);max-width:68ch;margin-bottom:28px}
.rule{height:3px;background:var(--ink);width:52px;margin:18px 0 26px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.card>h3,.card>h4{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}

.stat{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:16px 18px}
.stat .v{font-family:var(--disp);font-size:38px;font-weight:900;line-height:.94;color:var(--blue)}
.stat .v small{font-size:18px;font-weight:700}
.stat .k{font-size:11.5px;color:var(--ink-soft);margin-top:7px;line-height:1.45}
.stat.g{border-left-color:var(--green)}
.stat.g .v{color:var(--green)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;background:#F7FAFC}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tablewrap table{font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F7FAFC}
td.why{color:var(--ink-soft);font-size:12.5px;line-height:1.55;max-width:460px}

.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tag.b{background:#E4EFFA;color:var(--blue-deep)}
.tag.g{background:var(--ok-bg);color:#00694C}
.tag.a{background:var(--amber-bg);color:var(--amber)}
.tag.r{background:var(--warn-bg);color:var(--warn)}
.tag.n{background:#EEF2F6;color:var(--ink-soft)}

.note{border-radius:10px;padding:15px 18px;margin:16px 0;font-size:14px;border:1px solid}
.note.ok{background:var(--ok-bg);border-color:#B7E0D0}
.note.warn{background:var(--warn-bg);border-color:#F0C4C0}
.note.info{background:#EAF2FB;border-color:#C2D9F0}
.note.amber{background:var(--amber-bg);border-color:#EBD9A0}
.note b{display:block;margin-bottom:5px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}

ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:9px 0 9px 26px;border-bottom:1px solid var(--line);position:relative;font-size:14px}
ul.clean li:last-child{border-bottom:0}
ul.clean li::before{content:"";position:absolute;left:4px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
ul.clean.g li::before{background:var(--green)}
ul.clean.x li::before{content:"×";background:none;left:2px;top:8px;width:auto;height:auto;color:var(--warn);font-weight:700;font-size:17px}
ul.clean.v li::before{content:"✓";background:none;left:2px;top:9px;width:auto;height:auto;color:var(--green);font-weight:700;font-size:14px}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-family:var(--body);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--blue-deep)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper)}
.btn.gr{background:var(--green)}
.btn.gr:hover{background:#00734F}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{font-family:var(--body);font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:2px solid var(--blue);outline-offset:-1px}
label.fld{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:5px}

/* ---------- Полиця в масштабі ---------- */
.shelf{background:linear-gradient(180deg,#fff 0%,#E8EFF6 100%);border:1px solid var(--line);border-radius:12px;padding:26px 20px 0;overflow-x:auto}
.shelfrow{display:flex;align-items:flex-end;gap:14px;min-height:238px}
.shelfsep{flex:0 0 1px;align-self:stretch;background:var(--line);margin:0 10px 26px}
.shelfhdr{display:flex;margin-bottom:7px}
.shelfhdr i{flex:0 0 auto}
.shelfhdr span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#9DB1C4;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--line)}
.bt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0;font-family:var(--body)}
.bt .cap,.bt .neck,.bt .body{display:block}
.bt .cap{width:46%;height:7px;border-radius:2px 2px 0 0}
.bt .neck{width:38%;height:9px}
.bt .body{width:100%;border-radius:4px 4px 3px 3px;transition:transform .16s,box-shadow .16s}
.bt:hover .body{transform:translateY(-5px);box-shadow:0 8px 18px rgba(11,33,55,.22)}
.bt .dots{display:flex;gap:3px;justify-content:center;height:9px;align-items:center;margin-top:7px}
.bt .dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid;display:block}
.shelfdiv{flex:0 0 auto;width:0;border-left:1px dashed #A9BACB;align-self:stretch;margin:0 13px}
.bt .lbl{font-size:9.5px;color:var(--ink-soft);margin-top:5px;text-align:center;line-height:1.3;font-weight:600;font-family:var(--mono);min-height:25px;display:block}
.bt .lbl u{text-decoration:none;color:#93A7B9;font-size:8.5px;letter-spacing:.06em}
.bt .lbl em{font-style:normal;color:var(--red)}
.shelfbase{height:9px;background:var(--ink);border-radius:2px;margin-top:2px}
.shelfnote{font-size:11.5px;color:var(--ink-soft);padding:12px 2px 16px;line-height:1.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
#tip{position:fixed;z-index:80;background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .12s;width:232px;box-shadow:0 12px 32px rgba(11,33,55,.3)}
#tip.show{opacity:1}
#tip b.t{display:block;font-family:var(--disp);font-size:19px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin-bottom:2px}
#tip .sub{color:#9DB4CA;font-size:11px;margin-bottom:8px}
#tip .r{display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(255,255,255,.13);padding:4px 0 0;margin-top:4px}
#tip .r span{color:#9DB4CA}
#tip .r i{font-style:normal;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}

/* ---------- Каталог ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--body);color:var(--ink-soft);transition:.15s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.skugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:14px}
.sku{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 16px;cursor:pointer;transition:.15s}
.sku:hover{border-color:var(--blue);box-shadow:0 5px 16px rgba(11,33,55,.09)}
.sku .top{display:flex;gap:13px;align-items:flex-start;margin-bottom:10px}
.sku .mini{flex:0 0 26px;display:flex;flex-direction:column;align-items:center}
.sku .nm{font-family:var(--disp);font-size:22px;font-weight:800;text-transform:uppercase;line-height:.98;letter-spacing:.01em}
.sku .gs{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.sku .ean{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:9px;margin-top:10px}
.sku .tags{display:flex;gap:5px;flex-wrap:wrap}
.modalbg{position:fixed;inset:0;background:rgba(11,33,55,.55);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:34px 18px;overflow-y:auto}
.modalbg.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:26px 28px 30px;position:relative}
.modal .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px 8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-soft);padding:7px 0;border-bottom:1px solid var(--line)}
.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line);text-align:right;font-weight:600}
.kv dd.mono{font-family:var(--mono);font-weight:500}

/* ---------- Калькулятори / тест ---------- */
.calcrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.calcrow>div{flex:1 1 165px}
.out{background:var(--ink);color:#fff;border-radius:11px;padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:16px}
.out div span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8FA6BC;margin-bottom:5px}
.out div b{font-family:var(--disp);font-size:28px;font-weight:900;line-height:1}
.out div b small{font-size:13px;font-weight:700;color:#B9CBDB}
.gap{background:#122E49;color:#DCE7F1;border-radius:0 0 11px 11px;margin-top:-11px;padding:13px 20px;font-size:13px;border-top:1px solid rgba(255,255,255,.12)}
.gap b{color:#fff}

.q{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px 20px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:12px;font-size:14.5px}
.q .qt i{font-family:var(--mono);font-style:normal;color:var(--blue);margin-right:8px;font-size:12.5px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:7px;font-family:var(--body);font-size:13.5px;cursor:pointer;transition:.12s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue);background:#F5F9FD}
.opt.right{border-color:var(--green);background:var(--ok-bg);font-weight:600}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.opt:disabled{cursor:default}
.expl{font-size:12.5px;color:var(--ink-soft);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
.expl.show{display:block}

.cert{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:38px 40px;text-align:center;margin-top:18px}
.cert .ttl{font-family:var(--disp);font-size:36px;font-weight:900;text-transform:uppercase;line-height:1;margin-bottom:6px}
.cert .who{font-family:var(--disp);font-size:31px;font-weight:800;color:var(--blue);margin:20px 0 6px;text-transform:uppercase}
.cert .meta{font-size:12.5px;color:var(--ink-soft);margin-top:16px;line-height:1.7}

.donebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 20px;margin-top:30px}
.donebar p{margin:0;font-size:13px;color:var(--ink-soft);flex:1 1 220px}
.footer{font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--line);margin-top:36px;padding-top:16px;line-height:1.7}

.sw{display:flex;gap:11px;flex-wrap:wrap}
.sw>div{flex:1 1 118px;min-width:110px}
.sw .chipc{height:54px;border-radius:8px;border:1px solid rgba(11,33,55,.12)}
.sw .lb{font-family:var(--mono);font-size:11px;margin-top:7px;line-height:1.5}

/* ---------- Планшет ---------- */
@media(max-width:900px){
  .hdrtop{flex-wrap:wrap;padding:10px 16px;gap:10px 12px}
  .searchbox{order:3;flex:1 1 100%;max-width:none}
  .prog{margin-left:auto}
  .tabs{padding:2px 8px 0}
  .tabs a{padding:8px 9px 7px;font-size:12px}
  .tabgroup{padding-left:8px;margin-right:8px}
  .wrap{padding:24px 16px 80px}
  .tabs .glab{display:none}
  .grid2{grid-template-columns:1fr}
}

/* ---------- Телефон ---------- */
@media(max-width:640px){
  body{font-size:14.5px}
  .hdrtop{padding:9px 14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .logo{font-size:22px}
  .logo span{font-size:8px;letter-spacing:.12em;margin-top:3px}
  .prog{font-size:11px;gap:7px}
  .progbar{width:64px}
  /* Safari на iOS збільшує сторінку при фокусі, якщо кегль поля менший за 16px */
  .searchbox input{font-size:16px;padding:10px 13px 10px 40px}
  .searchbox.filled input{padding-right:38px}
  .searchres{max-height:56vh}
  .searchres button{padding:12px 14px;font-size:13.5px}
  /* межі груп у меню лишаються помітними, коли підписи груп сховані */
  .tabgroup+.tabgroup{border-left:1px solid var(--line);padding-left:7px;margin-left:7px}

  /* меню ховається при прокрутці вниз і повертається при прокрутці вгору */
  /* Меню-шторка: розкривається поверх контенту, тому нічого не зсувається */
  .menubtn{display:inline-flex}

'<p style="font-size:13.5px;color:var(--ink-soft)">Основний слоган бренду. Використовується за замовчуванням — у розмові, презентаціях, POS-матеріалах.</p>'+
'<p style="font-family:var(--disp);font-size:25px;font-weight:800;text-transform:uppercase;color:var(--ink-soft);line-height:1;margin:22px 0 8px">Енергія природи завжди з тобою</p>'+
'<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:0">Додатковий слоган. Застосовується в окремих випадках — там, де комунікація про активність, спорт і щоденну енергію.</p></div>'+
'<div class="card"><h3>Консолідація бренду</h3>'+
'<p>Раніше воду «Трускавецька» розливали кілька різних виробників. З 2023 року бренд консолідований однією компанією — <b>ТОВ «Трускавецька»</b>.</p>'+
'<p>Розлив відбувається на двох виробничих потужностях:</p>'+
'<ul class="clean"><li><b>ПІІ ТзОВ «Аква-Еко»</b> — вул. Івана Мазепи, 29, м. Трускавець, Львівська обл., 82200</li>'+
'<li><b>ТОВ «ТСБ»</b> — вул. Помірецька, 74, м. Трускавець, Львівська обл.</li></ul>'+
'<div class="note info" style="margin-bottom:0"><b>Чому це важливо для продажу</b>Клієнт може пам\'ятати, що «раніше було кілька Трускавецьких». Правильна відповідь: бренд консолідований, єдиний стандарт якості, єдиний власник торгової марки. Це аргумент за нас, а не проти.</div></div>'+
'<div class="card" style="border-left:3px solid var(--green)"><h3>Третій завод</h3>'+
'<p>Зараз будується <b>третій завод бренду</b>. За обсягами виробництва він перевищить перші два, разом узяті.</p>'+
'<p style="margin-bottom:0">Для розмови з клієнтом це найсильніший аргумент про стабільність постачань: питання «а ви впораєтесь з обсягом?» закривається планами розширення, а не обіцянками.</p></div>'+
'<div class="card"><h3>Реквізити, які треба знати напам\'ять</h3>'+
'<dl class="kv">'+
'<dt>Торгова марка</dt><dd>«Трускавецька»</dd>'+
'<dt>Основний слоган</dt><dd>З самого серця Карпат!</dd>'+
'<dt>Виробник (основні потужності)</dt><dd>ПІІ ТзОВ «Аква-Еко»</dd>'+
'<dt>Місто</dt><dd>Трускавець, Львівська обл.</dd>'+
'<dt>Гаряча лінія</dt><dd class="mono">0 800 30 18 27</dd>'+
'<dt>Сайт бренду</dt><dd class="mono">truskavetska.ua</dd>'+
'</dl></div>'
});

S.push({id:"origin",g:1,nav:"Походження",short:"Джерело",track:true,html:
'<div class="eyebrow">Розділ 2</div><h2>Походження</h2><div class="rule"></div>'+
'<p class="lede">Звідки береться вода і чому місце видобутку — це половина цінності продукту.</p>'+
'<div class="card"><h3>Шлях води</h3>'+
'<p>«Трускавецька» видобувається з геологічної формації Карпатських гір. Вода проходить крізь пласти древніх гірських порід — саме там вона набуває свого мінерального складу і природних лужних властивостей. Це не додається на заводі, це формує геологія.</p>'+
'<p>Свердловини розташовані в <b>охоронній зоні</b> і з усіх боків захищені гірським масивом та первозданними лісами. Доступ сторонніх виключений.</p>'+
'<div class="note ok" style="margin-bottom:0"><b>Формулювання для клієнта</b>«З самого серця Карпат — вода з екологічно чистої заповідної зони. Свердловини в охоронній зоні, склад сформований природою, а не технологією.»</div></div>'+
'<div class="card"><h3>Родовища й свердловини</h3>'+
'<p>Видобуток ведеться з кількох свердловин у м. Трускавець Дрогобицького району Львівської області:</p>'+
'<p class="mono" style="background:#F7FAFC;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.9">9912/38 · 0112/50 · 9810/28 · 0406/63 · 0111/46 · 24-Р(1) · 24-РР(2) · 24-РЕ(3) · 2-с · 4-с · 9807/25 · 42 · 42-к · 0411/61 · 0412/62</p>'+
'<p>Родовища: <b>Яружно-Помірецьке-1</b>, <b>Помірецьке</b> (у т.ч. західна ділянка), <b>Мражницьке</b>, <b>Янчурківське</b> (урочище Янчурки Доброгостівського лісництва).</p>'+
'<div class="note amber" style="margin-bottom:0"><b>Обережно з деталями</b>Номери свердловин потрібні для розуміння масштабу ресурсної бази, а не для переказування клієнту. У розмові достатньо: «видобуток із кількох офіційно зареєстрованих свердловин у Трускавці».</div></div>'
});

S.push({id:"history",g:1,nav:"Історія",short:"Історія",track:true,html:
'<div class="eyebrow">Розділ 3</div><h2>Трускавець: історія</h2><div class="rule"></div>'+
'<p class="lede">Курорт старший за більшість європейських брендів води. Це найсильніша емоційна частина розповіді.</p>'+
'<div class="card"><h3>Ключові факти</h3>'+
'<ul class="clean">'+
'<li>Цілющі джерела Трускавця відомі як <b>одні з найдавніших у Європі</b>.</li>'+
'<li><b>1827 рік</b> — місто офіційно отримало статус курорту. Саме з цього моменту починається його популярність.</li>'+
'<li>Європейські стандарти прижилися швидко: у місцевості <b>Помірки</b> створили купальне озеро з берегами, вкритими золотистим морським піском.</li>'+
'<li>Тут же побудували тенісні корти й спортивні майданчики — курорт розвивався як повноцінний європейський.</li>'+
'<li>Сьогодні Трускавець — місце, де минуле переплітається із сучасністю, а мінеральна вода стала символом здоров\'я та відновлення.</li>'+
'</ul></div>'+
'<div class="note info"><b>Як це використовувати</b>Аргумент «майже 200 років курортної історії» працює там, де хімія не працює — у HoReCa, преміальному сегменті й у розмові з власником точки. Скло 0,3 і 0,75 л продається саме цією історією.</div>'
});

S.push({id:"science",g:1,nav:"Склад води",short:"Склад",track:true,html:
'<div class="eyebrow">Розділ 4</div><h2>Склад і властивості</h2><div class="rule"></div>'+
'<p class="lede">Два числа, які має знати кожен: pH 7,8 і мінералізація 0,2–0,9 г/дм³. Усе інше — пояснення до них.</p>'+
'<div class="grid2">'+
'<div class="card"><h3>pH 7,8</h3>'+
'<p>Це <b>природний показник негазованої води</b>. Він максимально наближений до pH організму людини, завдяки чому вода зволожує глибше й ефективніше, ніж звичайна нейтральна.</p>'+
'<p>Такий самий показник рН мають лише кілька найвідоміших європейських мінеральних вод.</p>'+
'<div class="note amber" style="margin-bottom:0;font-size:13px"><b>Точність формулювання</b>Кажіть «природний pH 7,8 негазованої води». У газованих версіях розчинений CO₂ природно знижує показник — це фізика, а не зміна складу.</div></div>'+
'<div class="card"><h3>Мінералізація 0,2–0,9 г/дм³</h3>'+
'<p>Це <b>низький</b> рівень мінералізації. Саме він дозволяє вживати «Трускавецьку» щодня і без обмежень — дорослим і дітям.</p>'+
'<p>Порогом між прісними й мінеральними водами вважають 1 г/дм³. Ми нижче порогу — тому це <b>природна столова</b> вода, а не лікувальна.</p>'+
'<div class="note ok" style="margin-bottom:0;font-size:13px">Менша мінералізація ≠ гірша вода. Це інше призначення: щоденне пиття замість курсового прийому.</div></div>'+
'</div>'+
'<div class="card"><h3>Склад мінеральної води</h3>'+
'<p style="font-size:13.5px;color:var(--ink-soft)">Мінеральна природна столова, різного аніонного та різного катіонного складу. Стандарт — <b>ДСТУ 878-93</b> «Води мінеральні фасовані».</p>'+
'<div class="tablewrap"><table><thead><tr><th>Показник</th><th class="num">Значення</th><th>Що це означає</th></tr></thead><tbody>'+
'<tr><td><b>Загальна мінералізація</b></td><td class="num">0,2–0,9 г/дм³</td><td class="why">Сумарна кількість розчинених солей і мікроелементів. До 1 г/дм³ — столова вода: організм не накопичує надлишок солей, тому її п\'ють щодня, у будь-якій кількості й без призначення лікаря.</td></tr>'+
'<tr><td><b>pH</b></td><td class="num">7,8</td><td class="why">Кислотно-лужний баланс. Значення понад 7,2 — лужна зона. Чим ближче до pH тканин організму, тим менше зусиль потрібно на засвоєння.</td></tr>'+
'<tr><td><b>Гідрокарбонати</b><br><span class="mono" style="font-size:11.5px">HCO₃</span></td><td class="num">100–650 мг/л</td><td class="why">Головний природний буфер води — саме гідрокарбонати тримають лужну реакцію. Дають м\'який, «округлий» смак без металевого чи різкого присмаку.</td></tr>'+
'<tr><td><b>Сульфати</b><br><span class="mono" style="font-size:11.5px">SO₄</span></td><td class="num">&lt; 150 мг/л</td><td class="why">У великій кількості дають гіркуватий присмак. У нас їх мало — тому смак нейтральний і вода підходить для щоденного вживання всією родиною.</td></tr>'+
'<tr><td><b>Хлориди</b><br><span class="mono" style="font-size:11.5px">Cl</span></td><td class="num">&lt; 120 мг/л</td><td class="why">Відповідають за солонуватість. Низький вміст означає, що вода не сприймається як солона і не викликає спраги після випитого.</td></tr>'+
'<tr><td><b>Кальцій</b><br><span class="mono" style="font-size:11.5px">Ca</span></td><td class="num">10–180 мг/л</td><td class="why">Мінерал кісткової тканини; бере участь у роботі кровоносної системи. У воді перебуває в іонній формі, тобто вже готовій до засвоєння.</td></tr>'+
'<tr><td><b>Магній</b><br><span class="mono" style="font-size:11.5px">Mg</span></td><td class="num">&lt; 100 мг/л</td><td class="why">Задіяний у роботі м\'язів, нервової системи, серця та нирок. Один із мінералів, які організм витрачає щодня і поповнює з їжею та водою.</td></tr>'+
'<tr><td><b>Натрій + Калій</b><br><span class="mono" style="font-size:11.5px">Na⁺ + K⁺</span></td><td class="num">&lt; 200 мг/л</td><td class="why">Основні електроліти. Натрій бере участь у регуляції кількості рідини, тиску та роботи м\'язів; калій — у роботі серцевого м\'яза, його скороченні й розслабленні. Сумарно менш ніж 200 мг/л — вода не перевантажує організм натрієм.</td></tr>'+
'</tbody></table></div>'+
'<div class="note amber" style="margin-bottom:0"><b>Як користуватися колонкою «що це означає»</b>Це опис ролі показника у воді загалом — щоб ви розуміли, про що говорите. Це <b>не</b> твердження про лікувальну дію продукту. Клієнту переказувати своїми словами, без обіцянок результату.</div></div>'+
'<div class="card"><h3>Склад питної води «Особлива» 7 л</h3>'+
'<p style="font-size:13.5px;color:var(--ink-soft)">Вода питна негазована оброблена. Інша категорія продукту — не мінеральна, тому й склад описується окремо.</p>'+
'<div class="tablewrap"><table><thead><tr><th>Показник</th><th class="num">мг/дм³</th><th>Що це означає</th></tr></thead><tbody>'+
'<tr><td><b>Кальцій</b> <span class="mono" style="font-size:11.5px">Ca</span></td><td class="num">30–40</td><td class="why">Стабільний, вирівняний рівень — вода передбачувана на смак і не дає накипу так, як жорстка водопровідна.</td></tr>'+
'<tr><td><b>Магній</b> <span class="mono" style="font-size:11.5px">Mg</span></td><td class="num">10–20</td><td class="why">Помірний вміст, який зберігається після обробки води.</td></tr>'+
'<tr><td><b>Натрій</b> <span class="mono" style="font-size:11.5px">Na</span></td><td class="num">5–7</td><td class="why">Дуже низький. Саме тому «Особлива» добре підходить для щоденного готування їжі та напоїв — вона не «досолює» страву.</td></tr>'+
'<tr><td><b>Калій</b> <span class="mono" style="font-size:11.5px">K</span></td><td class="num">1–2</td><td class="why">Присутній у слідових кількостях.</td></tr>'+
'<tr><td><b>Гідрокарбонати</b> <span class="mono" style="font-size:11.5px">HCO₃</span></td><td class="num">110–130</td><td class="why">Забезпечують м\'який смак без різкості. Вузький діапазон означає стабільність партії до партії.</td></tr>'+
'<tr><td><b>Сульфати</b> <span class="mono" style="font-size:11.5px">SO₄</span></td><td class="num">5–6</td><td class="why">Практично відсутні — жодного гіркуватого відтінку в смаку.</td></tr>'+
'<tr><td><b>Хлор</b> <span class="mono" style="font-size:11.5px">Cl</span></td><td class="num">10–20</td><td class="why">Низький вміст хлоридів; вода нейтральна на смак, без солонуватості.</td></tr>'+
'<tr><td><b>Фтор</b> <span class="mono" style="font-size:11.5px">F</span></td><td class="num">0,5–0,7</td><td class="why">Природний мікроелемент, присутній у кількості, безпечній для щоденного вживання.</td></tr>'+
'</tbody></table></div>'+
'<div class="note warn" style="margin-bottom:0"><b>Не переносьте аргументи</b>pH 7,8 і мінералізація 0,2–0,9 г/дм³ стосуються <b>мінеральної</b> лінійки. Для «Особливої» ці цифри не використовуються.</div></div>'+
'<div class="card"><h3>Що доведено клінічно</h3>'+
'<p>Клінічними дослідженнями ДУ «Український НДІ медичної реабілітації та курортології МОЗ України» при курсовому внутрішньому прийомі підтверджено, що вода:</p>'+
'<ul class="clean v">'+
'<li>надає детоксикаційного ефекту</li>'+
'<li>активізує антиоксидантну систему</li>'+
'<li>посилює адаптаційні можливості організму</li>'+
'<li>сприяє сталості кислотно-лужного балансу</li>'+
'<li>сприяє підвищенню кількості лейкоцитів периферійної крові</li>'+
'<li>підвищує до рівня «високої оцінки» загальне самопочуття, активність і настрій (за анкетуванням САН)</li>'+
'</ul>'+
'<div class="note warn" style="margin-bottom:0"><b>Стоп-лінія</b>Цей список — вичерпний. Усе, чого в ньому немає, говорити клієнту не можна. Деталі — у розділі «Що можна говорити».</div></div>'
});

function go(id,skipHash){

  document.querySelectorAll("section.pane").forEach(function(p){p.classList.remove("on");});

/* ---- Полиця в масштабі ---- */
var GASHORT={"негазована":"н","слабогазована":"сл","сильногазована":"сил"};
/* Один силует на формат: усі газації одного об'єму мають однакову пляшку.
   Порядок: спершу скло, далі ПЕТ; усередині — за зростанням об'єму, SPORT одразу після своєї 0,75 л. */
var SHELF=GROUPS.map(function(g){
  var s=SKUS.filter(function(x){return x.id===g.src;})[0];
  var members=(g.key==="g075s")
    ? SKUS.filter(function(x){return x.line==="SPORT";})
    : SKUS.filter(function(x){return x.vol===s.vol&&x.pack===s.pack&&x.line===s.line;});
  return {g:g,s:s,members:members,
    gases:members.map(function(m){return GASHORT[m.gas];}),
    isGlass:s.pack==="Скло",
    sortA:s.pack==="Скло"?0:1, sortB:g.litres, sortC:(g.key==="g075s")?1:0};
}).sort(function(a,b){ return a.sortA-b.sortA || a.sortB-b.sortB || a.sortC-b.sortC; });

var SC=5.4;
/* Полиця перемальовується під ширину екрана: масштаб підбирається так,
   щоб уся лінійка вміщалась без горизонтальної прокрутки. */
function drawShelf(){
  var narrow=(window.innerWidth||1024)<=640;
  var GAP=narrow?10:14, SEP=narrow?13:21, PAD=narrow?28:40;
  var vw=document.documentElement.clientWidth||window.innerWidth||1024;
  var avail=Math.min(vw,1060)-(narrow?28:52)-PAD;          /* поля .wrap і .shelf */
  var cm=SHELF.reduce(function(t,i){return t+i.s.dw;},0);   /* сумарна ширина пляшок, см */
  var fixed=GAP*(SHELF.length-1)+SEP;
  SC=Math.max(2.6,Math.min(5.4,(avail-fixed)/cm));

  var shelf=document.getElementById("shelf");
  shelf.innerHTML="";
  SHELF.forEach(function(it,i){
    var s=it.s, prev=SHELF[i-1];
    if(prev && prev.isGlass!==it.isGlass){
      var sp=document.createElement("span"); sp.className="shelfsep"; shelf.appendChild(sp);
    }
    var b=document.createElement("button");
    b.className="bt"; b.dataset.grp=it.g.key; b.style.width=(s.dw*SC)+"px";
    b.title=it.g.label;
    var f=it.isGlass?"#E3EEF8":"#FFFFFF", st=it.isGlass?"#7FA3C4":"#9DB1C4";
    var bd="1.5px "+(it.isGlass?"dashed":"solid")+" "+st;
    b.innerHTML='<span class="cap" style="background:'+f+';border:'+bd+';border-bottom:0"></span>'+
      '<span class="neck" style="background:'+f+';border-left:'+bd+';border-right:'+bd+'"></span>'+
      '<span class="body" style="height:'+((s.dh-2.5)*SC)+'px;background:'+f+';border:'+bd+'"></span>'+
      '<span class="lbl">'+s.vol.replace(" л","")+(it.g.key==="g075s"?' <em>S</em>':'')+
      '<br><u>'+it.gases.join("·")+'</u></span>';
    shelf.appendChild(b);
  });
  drawShelfHdr(GAP,SEP);
}
/* Заголовки Скло / ПЕТ рівно над своїми групами */
function drawShelfHdr(GAP,SEP){
  var hd=document.getElementById("shelfhdr");
  var gl=SHELF.filter(function(i){return i.isGlass;}), pe=SHELF.filter(function(i){return !i.isGlass;});
  function span(a){ return a.reduce(function(t,i){return t+i.s.dw*SC;},0)+GAP*(a.length-1); }
  hd.innerHTML='<span style="width:'+span(gl)+'px">Скло</span>'+
    '<i style="width:'+(GAP+SEP+GAP)+'px"></i>'+
    '<span style="width:'+span(pe)+'px">ПЕТ</span>';
}
drawShelf();
(function(){

  if(el.dataset.grp){
    var it=SHELF.filter(function(x){return x.g.key===el.dataset.grp;})[0]; if(!it) return;
    s=it.s;

function calcPallet(){
  var g=GROUPS[parseInt(document.getElementById("calcSku").value,10)];
  var q=Math.max(1,parseFloat(document.getElementById("calcQty").value)||1);
  var unit=document.getElementById("calcUnit").value;
  var packsPerPallet=g.pallet/g.box;
  var bottles,packs;
  if(unit==="btl"){ bottles=q; packs=q/g.box; }
  else if(unit==="pack"){ packs=q; bottles=q*g.box; }
  else { packs=q*packsPerPallet; bottles=packs*g.box; }
  var pallets=packs/packsPerPallet;
  var layersTot=packs/g.layer;
  var kg=(g.wp/packsPerPallet)*packs;
  document.getElementById("calcOut").innerHTML=
    '<div><span>Пляшок</span><b>'+Math.round(bottles).toLocaleString("uk-UA")+'</b></div>'+
    '<div><span>Упаковок</span><b>'+dec1(packs)+'</b></div>'+
    '<div><span>Шарів</span><b>'+Math.round(layersTot).toLocaleString("uk-UA")+'</b></div>'+
    '<div><span>Палет</span><b>'+dec1(pallets)+'</b></div>'+
    '<div><span>Вага брутто</span><b>'+Math.round(kg).toLocaleString("uk-UA")+'<small> кг</small></b></div>'+
    '<div><span>Об\'єм води</span><b>'+Math.round(bottles*g.litres).toLocaleString("uk-UA")+'<small> л</small></b></div>';
  var packsWhole=Math.ceil(packs-1e-9);
  var rest=packsWhole%packsPerPallet;
  var gapEl=document.getElementById("calcGap");
  var full=Math.floor(packsWhole/packsPerPallet);
  if(rest===0){
    gapEl.innerHTML='Рівно <b>'+full+'</b> '+plural(full,["повна палета","повні палети","повних палет"])+' — залишків немає.';
  }else{
    var needPacks=packsPerPallet-rest;
    gapEl.innerHTML=(full>0?'<b>'+full+'</b> '+plural(full,["повна палета","повні палети","повних палет"])+' + ':'')+
      'неповна палета: <b>'+rest+'</b> '+plural(rest,PACKN)+' з '+packsPerPallet+
      '. Щоб закрити палету, не вистачає <b>'+needPacks+'</b> '+plural(needPacks,PACKN)+
      ' ('+(needPacks*g.box).toLocaleString("uk-UA")+' '+plural(needPacks*g.box,["пляшка","пляшки","пляшок"])+').';
  }
}

    '<div><span>Націнка</span><b>'+markup.toFixed(0)+'<small>%</small></b></div>'+
    '<div><span>Маржа</span><b>'+margin.toFixed(0)+'<small>%</small></b></div>'+
    '<div><span>З палети</span><b>'+Math.round(profit*g.pallet).toLocaleString("uk-UA")+'<small> грн</small></b></div>';
}

/* ---- Тест ---- */
var answers={};
function buildQuiz(){
  var w=document.getElementById("quizWrap"); w.innerHTML=""; answers={};
  QUIZ.forEach(function(q,i){
    var d=document.createElement("div"); d.className="q";
    var opts="";
    q[1].forEach(function(o,j){ opts+='<button class="opt" data-q="'+i+'" data-o="'+j+'">'+o+'</button>'; });
    d.innerHTML='<div class="qt"><i>'+String(i+1).padStart(2,"0")+'</i>'+q[0]+'</div>'+opts+'<div class="expl" id="ex'+i+'">'+q[3]+'</div>';
    w.appendChild(d);
  });
  document.getElementById("quizResult").innerHTML="";
}
document.addEventListener("click",function(e){
  var b=e.target.closest(".opt"); if(!b||b.disabled) return;
  var qi=parseInt(b.dataset.q,10), oi=parseInt(b.dataset.o,10);
  if(answers[qi]!==undefined) return;
  answers[qi]=oi;
  var correct=QUIZ[qi][2];
  b.parentNode.querySelectorAll(".opt").forEach(function(o){
    o.disabled=true;
    var j=parseInt(o.dataset.o,10);
    if(j===correct) o.classList.add("right");
    else if(j===oi) o.classList.add("wrong");
  });
  document.getElementById("ex"+qi).classList.add("show");
});
function checkQuiz(){
  var n=0;
  QUIZ.forEach(function(q,i){ if(answers[i]===q[2]) n++; });
  var answered=Object.keys(answers).length;
  var r=document.getElementById("quizResult");
  if(answered<QUIZ.length){
    r.innerHTML='<div class="note amber"><b>Ще не все</b>Відповіли на '+answered+' із '+QUIZ.length+' питань. Дайте відповідь на всі, щоб отримати результат.</div>';
    return;
  }
  var pass=n>=16;
  var html='<div class="note '+(pass?"ok":"warn")+'"><b>'+(pass?"Тест складено":"Тест не складено")+'</b>'+
    'Правильних відповідей: <b>'+n+' із '+QUIZ.length+'</b> ('+Math.round(n/QUIZ.length*100)+'%). Прохідний бал — 16.'+
    (pass?'':' Перегляньте розділи, у яких помилилися, і пройдіть тест заново.')+'</div>';
  if(pass){
    html+='<div class="card"><h3>Сертифікат</h3>'+
      '<div class="calcrow"><div><label class="fld" for="certName">Прізвище та ім\'я</label>'+
      '<input type="text" id="certName" placeholder="Введіть ПІБ" style="width:100%"></div>'+
      '<div style="flex:0 0 auto"><button class="btn" id="certBtn">Сформувати</button></div></div>'+
      '<div id="certOut"></div></div>';
  }
  r.innerHTML=html;
  if(pass){
    document.getElementById("certBtn").onclick=function(){
      var nm=(document.getElementById("certName").value||"").trim();
      if(!nm){ document.getElementById("certName").focus(); return; }
      var d=new Date();
      var ds=String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
      document.getElementById("certOut").innerHTML=
        '<div class="cert"><div class="eyebrow" style="margin-bottom:6px">ТМ «Трускавецька» · З самого серця Карпат!</div>'+
        '<div class="ttl">Сертифікат<br>про проходження навчання</div>'+
        '<div style="font-size:13px;color:var(--ink-soft);margin-top:14px">Підтверджує, що</div>'+
        '<div class="who">'+nm.replace(/[<>]/g,"")+'</div>'+
        '<div style="font-size:13.5px">успішно склав(ла) підсумковий тест внутрішнього навчального курсу<br>про продукцію ТМ «Трускавецька»</div>'+
        '<div class="meta">Результат: '+n+' із '+QUIZ.length+' ('+Math.round(n/QUIZ.length*100)+'%)<br>Дата: '+ds+'<br>Для внутрішнього використання</div></div>'+
        '<button class="btn ghost" style="margin-top:14px" onclick="window.print()">Роздрукувати</button>';
    };
  }
}

var SEARCH=[];
S.forEach(function(s){
  var txt=s.html.replace(/<[^>]+>/g," ").replace(/\s+/g," ");
  SEARCH.push({t:s.nav,h:"Розділ",go:s.id,q:(s.nav+" "+txt).toLowerCase()});
});
SKUS_ORD.forEach(function(s){
  SEARCH.push({t:s.name,h:"Товар · "+s.ean,sku:s.id,
    q:(s.name+" "+s.ean+" "+s.eanBox+" "+s.uktzed+" "+s.vol+" "+s.gas+" "+s.pack+" "+s.line).toLowerCase()});
});
var si=document.getElementById("search"), sr=document.getElementById("searchres"), sbox=si.parentNode;
var srItems=[], srIdx=-1;

/* Результати впорядковуються: спершу збіг у назві, потім товари, потім згадки в тексті розділу */
function rank(x,v){
  var t=x.t.toLowerCase();
  if(t.indexOf(v)===0) return 0;
  if(t.indexOf(v)>=0) return 1;
  if(x.sku && (x.q.indexOf(v)>=0)) return 2;
  return 3;
}
function closeRes(){
  sr.classList.remove("show"); si.setAttribute("aria-expanded","false");
  srItems=[]; srIdx=-1;
}
function markAct(){
  sr.querySelectorAll("button").forEach(function(b,i){ b.classList.toggle("act",i===srIdx); });
  if(srIdx>=0){
    var el=sr.querySelectorAll("button")[srIdx];
    if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
  }
}
function openRes(x){
  closeRes(); si.value=""; sbox.classList.remove("filled"); si.blur();
  if(x.sku){ go("catalog"); openSku(x.sku); } else { go(x.go); }
}
function runSearch(){
  var v=si.value.trim().toLowerCase();
  sbox.classList.toggle("filled",v.length>0);
  if(v.length<2){ closeRes(); return; }
  var all=SEARCH.filter(function(x){return x.q.indexOf(v)>=0;})
    .sort(function(a,b){ return rank(a,v)-rank(b,v); });
  srItems=all.slice(0,10); srIdx=-1;
  if(!all.length){
    sr.innerHTML='<div class="empty">Нічого не знайшли. Спробуйте штрих-код, об\'єм або назву розділу.</div>';
    sr.classList.add("show"); si.setAttribute("aria-expanded","true"); return;
  }
  sr.innerHTML="";
  srItems.forEach(function(x,i){
    var b=document.createElement("button");
    b.type="button"; b.setAttribute("role","option");
    b.innerHTML=x.t+'<span class="hint">'+x.h+'</span>';
    b.onclick=function(){ openRes(x); };
    b.onmouseenter=function(){ srIdx=i; markAct(); };
    sr.appendChild(b);
  });
  if(all.length>srItems.length){
    var m=document.createElement("div"); m.className="more";
    m.textContent="Показано 10 із "+all.length+". Уточніть запит.";
    sr.appendChild(m);
  }
  sr.classList.add("show"); si.setAttribute("aria-expanded","true");
}
si.addEventListener("input",runSearch);
si.addEventListener("focus",function(){ if(si.value.trim().length>=2) runSearch(); });
si.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ si.value=""; sbox.classList.remove("filled"); closeRes(); si.blur(); return; }
  if(!srItems.length) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); srIdx=(srIdx+1)%srItems.length; markAct(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); srIdx=(srIdx-1+srItems.length)%srItems.length; markAct(); }
  else if(e.key==="Enter"){ e.preventDefault(); openRes(srItems[srIdx<0?0:srIdx]); }
});
document.getElementById("searchclr").onclick=function(){
  si.value=""; sbox.classList.remove("filled"); closeRes(); si.focus();
};
document.addEventListener("click",function(e){ if(!e.target.closest(".searchbox")) closeRes(); });

/* ---- Меню-шторка на телефоні: розкривається поверх контенту, нічого не зсуває ---- */
(function(){
  var btn=document.getElementById("menubtn"), tabs=document.getElementById("tabs"),
      scrim=document.getElementById("scrim");
  function isMobile(){ return (window.innerWidth||1024)<=640; }
  function openSheet(){ tabs.classList.add("open"); scrim.classList.add("show"); btn.setAttribute("aria-expanded","true"); }
  function closeSheet(){ tabs.classList.remove("open"); scrim.classList.remove("show"); btn.setAttribute("aria-expanded","false"); }
  btn.addEventListener("click",function(e){
    e.stopPropagation(); e.preventDefault();
    if(tabs.classList.contains("open")) closeSheet(); else openSheet();
  });
  scrim.addEventListener("click",closeSheet);
  tabs.addEventListener("click",function(e){ if(e.target.closest("a")) closeSheet(); });
  document.addEventListener("click",function(e){
    if(!isMobile() || !tabs.classList.contains("open")) return;
    if(!e.target.closest("#tabs") && !e.target.closest("#menubtn")) closeSheet();
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });
  window.addEventListener("resize",function(){
    if(!isMobile()) closeSheet();
    clearTimeout(btn._t); btn._t=setTimeout(refreshTabs,120);
  });
  if(window.matchMedia){
    try{ window.matchMedia("(max-width:640px)").addEventListener("change",refreshTabs); }catch(err){}
  }
  window.setMenuBtn=function(id){
    var s=S.filter(function(x){return x.id===id;})[0];
    btn.querySelector(".cur").textContent=s?(s.short||s.nav):"Розділи";
  };
})();
