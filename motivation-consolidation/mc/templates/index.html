<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зведення мотивацій — ТМ Трускавецька</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1c2024; --muted:#6b7280; --line:#e3e6ea;
    --ok:#0f7b3f; --ok-bg:#e8f5ee; --warn:#8a5a00; --warn-bg:#fdf3e0;
    --err:#a5231b; --err-bg:#fdecea; --accent:#1a4fa0; --accent-bg:#eaf0fb;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
         display:flex;align-items:center;gap:16px;flex-wrap:wrap;
         position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0;font-weight:650}
  .spacer{flex:1}
  main{max-width:1080px;margin:0 auto;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:18px 20px;margin-bottom:16px}
  .step{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
        color:var(--muted);font-weight:650;margin-bottom:10px}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);
         border-radius:8px;padding:9px 16px;cursor:pointer}
  button:hover:not(:disabled){border-color:#b9c0c9}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;
                 font-weight:600}
  button.primary:hover:not(:disabled){background:#16408a}
  button.ghost{background:transparent}
  .drop{border:2px dashed #c6ccd4;border-radius:12px;padding:34px;text-align:center;
        background:#fbfcfd;cursor:pointer;transition:.15s}
  .drop.over{border-color:var(--accent);background:var(--accent-bg)}
  .drop strong{display:block;font-size:16px;margin-bottom:4px}
  .drop span{color:var(--muted);font-size:13px}
  .file{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;
        overflow:hidden;background:#fff}
  .file-head{display:flex;align-items:center;gap:12px;padding:14px 18px;
             border-left:5px solid var(--line)}
  .file.ok .file-head{border-left-color:var(--ok)}
  .file.warn .file-head{border-left-color:var(--warn)}
  .file.err .file-head{border-left-color:var(--err)}
  .file-name{font-weight:650}
  .file-sub{color:var(--muted);font-size:13px}
  .pill{font-size:12px;font-weight:650;padding:3px 10px;border-radius:999px;
        white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.err{background:var(--err-bg);color:var(--err)}
  .pill.new{background:var(--accent-bg);color:var(--accent)}
  .file-body{padding:0 18px 16px;border-top:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;
     letter-spacing:.04em}
  tbody tr:last-child td{border-bottom:none}
  .note{display:flex;gap:10px;padding:9px 12px;border-radius:8px;margin-top:8px;
        font-size:14px;align-items:flex-start}
  .note.ERROR{background:var(--err-bg)}
  .note.WARN{background:var(--warn-bg)}
  .note.INFO{background:#f1f3f5}
  .note code{font-size:12px;color:var(--muted);white-space:nowrap}
  .mark{font-weight:700;min-width:14px}
  .note.ERROR .mark{color:var(--err)}
  .note.WARN .mark{color:var(--warn)}
  .note.INFO .mark{color:var(--muted)}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--accent);font-size:14px}
  .bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
       padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .modal{position:fixed;inset:0;background:rgba(20,24,28,.5);display:none;
         align-items:center;justify-content:center;padding:24px;z-index:20}
  .modal.show{display:flex}
  .modal-inner{background:#fff;border-radius:12px;max-width:760px;width:100%;
               max-height:86vh;overflow:auto;padding:24px}
  .modal h2{margin:0 0 6px;font-size:19px}
  .banner{padding:12px 14px;border-radius:8px;background:var(--accent-bg);
          color:#123a78;margin:14px 0;font-size:14px}
  .muted{color:var(--muted)}
  .right{text-align:right}
  .hide{display:none}
  .status{font-size:13px;color:var(--muted)}
  .warnrow td{background:var(--warn-bg)}
</style>
</head>
<body>
<header>
  <h1>Зведення мотивацій · ТМ Трускавецька</h1>
  <span class="spacer"></span>
  <span class="status" id="state"></span>
  <button class="ghost" id="btn-download">Завантажити зведену</button>
</header>

<main>
  <section class="card" id="step-cons">
    <div class="step">Крок 1 · Зведена таблиця</div>
    <div id="cons-state"></div>
  </section>

  <section class="card">
    <div class="step">Крок 2 · Файли дистриб'юторів</div>
    <div class="drop" id="drop">
      <strong>Перетягни сюди файли Excel</strong>
      <span>або натисни, щоб обрати. Можна кілька одразу — система сама
            визначить дистриб'ютора і місяць</span>
    </div>
    <input type="file" id="picker" multiple accept=".xls,.xlsx,.xlsm" class="hide">
  </section>

  <div id="files"></div>
</main>

<div class="bar" id="bar" style="display:none">
  <span id="summary" class="status"></span>
  <span class="spacer" style="flex:1"></span>
  <label class="status"><input type="checkbox" id="fixtotals"> заразом
    полагодити діапазони «Сума»</label>
  <button class="ghost" id="btn-clear">Очистити список</button>
  <button class="primary" id="btn-apply">Внести у зведену</button>
</div>

<div class="modal" id="modal">
  <div class="modal-inner" id="modal-body"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let FILES = [];

const num = v => v === null || v === undefined ? '—'
  : new Intl.NumberFormat('uk-UA', {maximumFractionDigits: 2}).format(v);

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'помилка запиту');
  return data;
}

async function refreshState() {
  const s = await api('/api/state');
  if (s.has_consolidated) {
    $('#cons-state').innerHTML = `
      <p style="margin:0 0 10px">Зведену завантажено: <b>${s.months}</b>
      місяців, останній — <b>${s.last_month}</b>,
      <b>${s.distributors.length}</b> дистриб'юторів.</p>
      <button class="ghost" id="btn-recons">Замінити зведену</button>`;
    $('#btn-recons').onclick = pickConsolidated;
    $('#state').textContent = 'останній місяць: ' + s.last_month;
  } else {
    $('#cons-state').innerHTML = `
      <p style="margin:0 0 10px">Спершу завантаж файл зведеної таблиці —
      у нього система дописуватиме нові місяці.</p>
      <button class="primary" id="btn-cons">Обрати файл зведеної</button>`;
    $('#btn-cons').onclick = pickConsolidated;
    $('#state').textContent = 'зведену не завантажено';
  }
}

function pickConsolidated() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xlsm';
  inp.onchange = async () => {
    const fd = new FormData(); fd.append('file', inp.files[0]);
    try {
      await api('/api/consolidated', {method: 'POST', body: fd});
      await refreshState();
      if (FILES.length) await reanalyse();
    } catch (e) { alert(e.message); }
  };
  inp.click();
}

async function reanalyse() {
  const data = await api('/api/reanalyse', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({uids: FILES.map(f => f.uid)})});
  FILES = data.files;
  render();
}

async function uploadFiles(list) {
  const fd = new FormData();
  for (const f of list) fd.append('files', f);
  $('#drop').innerHTML = '<strong>Перевіряю…</strong><span>великі файли ' +
    'читаються до хвилини</span>';
  try {
    const data = await api('/api/upload', {method: 'POST', body: fd});
    FILES = FILES.concat(data.files);
    render();
  } catch (e) { alert(e.message); }
  $('#drop').innerHTML = '<strong>Перетягни сюди файли Excel</strong>' +
    '<span>або натисни, щоб обрати. Можна кілька одразу — система сама ' +
    'визначить дистриб\'ютора і місяць</span>';
}

function statusOf(f) {
  if (f.fatal || !f.ok) return 'err';
  return f.counts && f.counts.warn ? 'warn' : 'ok';
}

function blockTable(b) {
  return `<tr>
    <td>${b.metric_label} <span class="muted">(${b.unit})</span></td>
    <td>${num(b.plan)}</td><td>${num(b.fact)}</td>
    <td>${num(b.bonus_plan)}</td><td>${num(b.bonus_fact)}</td></tr>`;
}

function termsBlock(b) {
  const t = b.terms;
  if (!t) return '';
  if (!t.parsed) {
    return `<div class="note INFO"><span class="mark">·</span>
      <span>Мотивацію не звірено з умовами: ${t.summary}</span></div>`;
  }
  if (!t.rows.length) {
    return `<div class="note INFO"><span class="mark">✓</span>
      <span>Мотивація ${b.metric_label}: ${t.summary}</span></div>`;
  }
  const rows = t.rows.map(r => `<tr class="warnrow"><td>${r.label}</td>
    <td>${r.role}</td><td>${num(r.fact)}</td>
    <td>${num(r.actual)}</td><td>${num(r.expected)}</td></tr>`).join('');
  return `<details open><summary>Мотивація ${b.metric_label}: ${t.summary}</summary>
    <table><thead><tr><th>Рядок</th><th>Роль</th><th>Факт</th>
    <th>У файлі</th><th>За умовами</th></tr></thead>
    <tbody>${rows}</tbody></table></details>`;
}

function render() {
  const host = $('#files');
  if (!FILES.length) { host.innerHTML = ''; $('#bar').style.display = 'none'; return; }
  host.innerHTML = FILES.map(f => {
    if (f.fatal) {
      return `<div class="file err"><div class="file-head">
        <div><div class="file-name">${f.filename}</div>
        <div class="file-sub">${f.fatal}</div></div></div></div>`;
    }
    const st = statusOf(f);
    const label = st === 'ok' ? 'готово' : st === 'warn' ? 'є попередження'
                                         : 'потребує виправлення';
    const notes = f.findings.map(n => `<div class="note ${n.level}">
      <span class="mark">${n.level === 'ERROR' ? '✗' : n.level === 'WARN' ? '!' : '·'}</span>
      <span>${n.message}${n.where ? ` <code>${n.where}</code>` : ''}</span></div>`).join('');
    return `<div class="file ${st}">
      <div class="file-head">
        <div style="flex:1">
          <div class="file-name">${f.consolidated_name || f.distributor}</div>
          <div class="file-sub">${f.period_label} · ${f.kind} · ${f.filename}</div>
        </div>
        ${f.new_month ? '<span class="pill new">новий місяць</span>' : ''}
        <span class="pill ${st}">${label}</span>
      </div>
      <div class="file-body">
        <table><thead><tr><th>Показник</th><th>План</th><th>Факт</th>
          <th>Бонус план</th><th>Бонус факт</th></tr></thead>
          <tbody>${f.blocks.map(blockTable).join('')}</tbody></table>
        ${f.blocks.map(termsBlock).join('')}
        ${notes}
      </div></div>`;
  }).join('');

  const ready = FILES.filter(f => !f.fatal && f.ok);
  const blocked = FILES.length - ready.length;
  $('#bar').style.display = 'flex';
  $('#summary').textContent =
    `Файлів: ${FILES.length} · готових: ${ready.length}` +
    (blocked ? ` · потребують виправлення: ${blocked}` : '');
  $('#btn-apply').disabled = !ready.length;
  $('#btn-apply').textContent = `Внести у зведену (${ready.length})`;
}

async function openConfirm() {
  const uids = FILES.filter(f => !f.fatal && f.ok).map(f => f.uid);
  const p = await api('/api/preview', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({uids})});
  const rows = p.rows.map(r => `<tr><td>${r.distributor}</td><td>${r.metric}</td>
    <td>${r.period}</td><td>${num(r.plan)}</td><td>${num(r.fact)}</td>
    <td>${num(r.bonus_plan)}</td><td>${num(r.bonus_fact)}</td></tr>`).join('');
  let banner = '';
  if (p.new_months.length) {
    banner = `<div class="banner">Це перший підтверджений файл із планом на
      новий місяць. Разом із записом система:
      <ul style="margin:8px 0 0 18px">
        ${p.closing ? `<li>закриє <b>${p.closing}</b> — додасть колонки факту,
          бонусу факту і затратності</li>` : ''}
        <li>створить заготовку нового місяця з колонками плану</li>
        <li>перенесе умови акцій із планового аркуша</li>
      </ul></div>`;
  }
  $('#modal-body').innerHTML = `
    <h2>Підтвердження запису</h2>
    <p class="muted">Перевір, що саме буде записано у зведену.</p>
    ${banner}
    <table><thead><tr><th>Дистриб'ютор</th><th>Показник</th><th>Місяць</th>
      <th>План</th><th>Факт</th><th>Бонус план</th><th>Бонус факт</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
      <button class="ghost" id="m-cancel">Скасувати</button>
      <button class="primary" id="m-ok">Так, внести</button>
    </div>`;
  $('#modal').classList.add('show');
  $('#m-cancel').onclick = () => $('#modal').classList.remove('show');
  $('#m-ok').onclick = () => doApply(uids);
}

async function doApply(uids) {
  $('#m-ok').disabled = true;
  $('#m-ok').textContent = 'Записую…';
  try {
    const r = await api('/api/apply', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({uids, fix_totals: $('#fixtotals').checked})});
    const rows = r.applied.map(a => `<tr><td>${a.name}</td><td>${a.metric}</td>
      <td>${a.period}</td><td class="muted">${a.cells.join(', ')}</td></tr>`).join('');
    $('#modal-body').innerHTML = `
      <h2>Готово</h2>
      <p>Записано рядків: <b>${r.applied.length}</b>.
         Резервна копія: <code>${r.backup}</code></p>
      <table><thead><tr><th>Дистриб'ютор</th><th>Показник</th><th>Місяць</th>
        <th>Клітинки</th></tr></thead><tbody>${rows}</tbody></table>
      ${r.dropped.length ? `<div class="banner">При закритті місяця втрачено:
        <ul style="margin:8px 0 0 18px">${r.dropped.map(d =>
        `<li>${d}</li>`).join('')}</ul></div>` : ''}
      ${r.fixed.length ? `<details><summary>Полагоджено діапазонів «Сума»:
        ${r.fixed.length}</summary><pre style="font-size:12px;white-space:pre-wrap">${
        r.fixed.join('\n')}</pre></details>` : ''}
      ${r.skipped.length ? `<div class="banner">Пропущено: ${r.skipped.map(s =>
        `${s.name} — ${s.reason}`).join('; ')}</div>` : ''}
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
        <button class="ghost" id="m-close">Закрити</button>
        <button class="primary" id="m-dl">Завантажити зведену</button>
      </div>`;
    $('#m-close').onclick = async () => {
      $('#modal').classList.remove('show');
      FILES = FILES.filter(f => !uids.includes(f.uid));
      render(); await refreshState();
    };
    $('#m-dl').onclick = () => location.href = '/api/download';
  } catch (e) { alert(e.message); $('#m-ok').disabled = false; }
}

$('#drop').onclick = () => $('#picker').click();
$('#picker').onchange = e => uploadFiles(e.target.files);
['dragenter', 'dragover'].forEach(ev => $('#drop').addEventListener(ev, e => {
  e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('#drop').addEventListener(ev, e => {
  e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', e => uploadFiles(e.dataTransfer.files));
$('#btn-apply').onclick = openConfirm;
$('#btn-download').onclick = () => location.href = '/api/download';
$('#btn-clear').onclick = async () => {
  await api('/api/reset', {method: 'POST'});
  FILES = []; render();
};
$('#modal').onclick = e => {
  if (e.target === $('#modal')) $('#modal').classList.remove('show'); };

refreshState();
</script>
</body>
</html>
