<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#003C77" />
    <meta
      name="description"
      content="Внутрішній портал ТМ «Трускавецька» для працівників: асортимент, ціни, аргументація, склад, логістика, регламенти й контакти служб."
    />
    <!-- Внутрішній документ: у пошуку його бути не має -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

    <!-- iOS: повноекранний режим, коли додано на початковий екран -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Трускавецька+" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- вимикає авто-детекцію телефонів у Safari, яка ламає верстку таблиць -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <title>Трускавецька — портал для працівників</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Для роботи порталу потрібен увімкнений JavaScript.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
